name: pages

# GitHub Pages deployment for the HTML edition of the unified report.
#
# It is wired, tested, and the licence gate NOW OPENS: v1_hmda2022 is recorded in
# benchmarks/registry/distribution.yaml as CC BY 4.0 with redistribution_decision
# publish_text, so `tools/pages_authorized.py` authorizes the artifact and the page carries
# the case study unredacted. It previously refused, because that source was local_only with
# permits_redistribution unknown. The repository's rule is per source, not per file -- the
# distinction that cost a full history rewrite -- so the gate asks the ledger about the
# sources this artifact declares, and still refuses on silence for any future source.
#
# Nothing here decides a licence. If a new source enters the page with an unresolved
# licence, the gate closes again by itself.
#
# Still deliberately `workflow_dispatch` only, and that is now a choice about publication
# rather than about policy: the gate no longer blocks, so a push trigger would put a live
# deployment one merge away. Publishing stays an explicit, deliberate action.
#
# The PDF is deliberately not staged (tests/test_pages_gate.py enforces it): the page's
# text probes cannot see inside a PDF, so serving one would be exposure the quotation
# budget could not audit. Link to the repository copy instead.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Gate. Every later job needs this one, so a refusal stops the deployment.
  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml

      - name: The distribution ledger must authorize publication
        run: python tools/pages_authorized.py --artifact papers/unified-report-html

  # ── Publish the COMMITTED bytes, and check their properties. An earlier version rebuilt
  #    here and then ran `build.py --check`, which was vacuous: the rebuild overwrote the
  #    committed copy, so the check compared the file against itself. It also meant the
  #    served page was CI-pandoc output rather than the reviewed artifact -- Ubuntu's pandoc
  #    emits class="odd" on table rows where a newer one emits data-latex-placement, so the
  #    two differ by ~2 KB of markup nobody had looked at. `make check-report-html` is the
  #    place for build reproducibility (one pandoc, locally); what CI must enforce is that
  #    the bytes about to be served are redacted and within budget.
  build:
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Install what the gate needs (no build toolchain, nothing is rebuilt here)"
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pytest

      - name: The bytes to be served must be the redacted edition, within budget
        run: python -m pytest tests/test_no_unlicensed_publication.py tests/test_pages_gate.py -q

      # Stage the site, not the source directory. Uploading papers/unified-report-html/
      # wholesale also served build.py, template.html, README.md and
      # PUBLICATION_REQUIREMENTS.json at the site root -- repository artifacts, not site
      # content. The PDF is deliberately NOT staged: it carries the case-study row this
      # edition withholds, and a link to the repository copy is not the same as the site
      # serving it.
      - name: Stage only the site files
        run: |
          mkdir -p _site
          cp papers/unified-report-html/index.html _site/
          cp papers/unified-report-html/robots.txt papers/unified-report-html/sitemap.xml _site/
          cp -r papers/unified-report-html/assets _site/assets
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
