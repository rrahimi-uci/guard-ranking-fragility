# Source-by-source distribution ledger
#
# Canonical redistribution decision for every benchmark source whose text can reach a
# build. Validated by distribution.schema.json.
#
# This ledger fails closed. `default_decision: local_only` applies to any source not
# listed, and a source reaches `publish_text` only when its license affirmatively
# permits redistribution AND an attribution notice is recorded. The schema enforces
# both conditions, so an unresolved source cannot be published by omission.
#
# STATUS: no source currently qualifies for publish_text. The tracked explorer blob
# `benchmark-explorer/index.public.html` (53.0 MB, sha256 d7a67af5..., 16,146 rows
# across ten of the sources below) therefore has NO affirmative distribution decision
# and must not be republished, shard-built, or served from Pages until each source
# below carries one. `expguard` was added later and is NOT in that blob: its text has
# never been written to this repository at all, only text-free per-row scores.

schema_version: 1
ledger_id: guard_ranking_fragility_distribution_v1
reviewed_on: "2026-07-29"
default_decision: local_only

notes: >
  Two decisions are outstanding and require a human with authority to make them.
  (1) MortgageGuardBench-2K ships LICENSE_NOT_SELECTED.md, which states no publication
  license has been chosen and that organizational and legal review is required before
  redistribution; all 2,000 of its rows are presently embedded in a tracked, pushed
  blob in a public repository. (2) Several general-safety corpora are redistributed
  here as verbatim rows although their upstream terms are noncommercial or unverified.
  Until both are resolved, every source is local_only or text_free_only and no public
  build is authorized. Removing the blob from the working tree does not remove it from
  Git history; history rewriting is a separate destructive migration needing explicit
  approval and coordination with every clone.

sources:
