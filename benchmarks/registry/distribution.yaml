    kind: draft_unlicensed
    access_class: internal
    license:
      spdx_or_name: NOT_SELECTED
      permits_redistribution: false
      commercial_use: unknown
      snapshot: >
        No LICENSE file accompanies this corpus. Authored in-house (mortgage/fair-lending
        hard negatives with persona, trap_type and rationale fields, same family as
        mortgage_guard_bench_2k_v0_1_0, whose license is likewise NOT_SELECTED).
    redistribution_decision: local_only
    derived_output_license: none_until_source_license_selected
    sensitive_text_class: synthetic_harmful
    attribution_notice: null
    reviewer: unassigned
    decision_date: "2026-07-26"
    row_count: 334
    payload:
      path: data/guard_benchmark_hard.jsonl
      revision: local_only_untracked
      sha256: "c17ff6eb2ef46db9dc6b48229bdcf4637165c8b9946fa6ff63f9df5ed4f0a2af"
    blocking_reason: >
      WAS PUBLISHED WHILE ABSENT FROM THIS LEDGER; PURGED 2026-07-26. 334 rows of verbatim
      prompt text, force-added past the /data/ ignore rule, sat on the public remote from
      the initial import until the history rewrite of 2026-07-26 removed every copy --
      three distinct paths across the repository's reorganisations, all carrying one blob.
      The file remains on local disk under ignored data/ and is fully usable for
      development; it is simply no longer redistributed. Publishing it again requires
      selecting a license first. Note that a rewrite does not retract what third parties
      already fetched.

