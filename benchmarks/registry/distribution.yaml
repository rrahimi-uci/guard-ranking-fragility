    row_count: 2275
    payload:
      path: hf://6rightjade/expguardmix/expguardtest.parquet
      revision: null
      sha256: unhashed
    blocking_reason: >
      LISTED RETROSPECTIVELY. ExpGuard was in use before it had an entry here, which is the
      same hole `guard_benchmark_hard` fell through: the ledger's default_decision
      (local_only) governed it, but no one had recorded a decision. Its prompt text has never
      been written to this repository -- it is fetched from the Hub at run time and held in
      memory only -- and the committed derivatives under artifacts/expguard_external/ and
      artifacts/qwen3_scale_ext/expguard/ are text-free per-row scores keyed by
      sha256(prompt)[:16] plus a {row_hash -> label, domain} index, which is what
      text_free_only permits. Those derivatives are already on the public remote. What is
      still missing is the affirmative part: the upstream licence has not been read, so
      whether ExpGuard permits even text-free derivative publication is unverified, and
      `derived_output_license` stays none_until_decision until a human reads the card and
      signs this row.

