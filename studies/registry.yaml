    study_state: released
    evidence_state: retrospective_estimation
    publication_state: current
    distribution_state: text_free_only
    test_exposure: check_papers
    evidence_tier: "mixed; each act declares its own tier"
    claim_authorization: true
    contract_type: live_release
    verification_mode: live_tree
    verification_command: "make -C papers/unified-report reproduce"
    expected_verification_status: expected_pass
    code_root: papers/unified-report/
    manuscript_paths: [papers/unified-report/unified_report.pdf, papers/unified-report/slides/]
    lock_bound_paths: true
    consumes: [paper_a_sft_v2, base_adapter_composition, klsft_v1, expguard_external,
               starting_type_adaptation_v1, mortgage_benchmark_v1_hmda2022]
    notes: >
      reproduce-check mutates canonical figure/intermediate files; it is excluded from
      read-only verification tiers until refactored to temporary output roots.
