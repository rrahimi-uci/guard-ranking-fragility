# Study registry — normative source of truth
#
# Validated by registry.schema.json. The root README, papers/README.md, and every
# status table summarize this file; none of them redefines study state.
#
# Two fields do the work that prose kept getting wrong:
#   expected_verification_status  a historical lock is *expected* to fail against an
#                                 evolved tree. Declaring that is how a real
#                                 regression stops hiding behind a known failure.
#   claim_authorization           false unless a contemporaneous authorization chain
#                                 proves otherwise. Development output never becomes
#                                 evidence by being moved, renamed, or re-verified.

schema_version: 1
registry_id: guard_ranking_fragility_studies_v1

last_verified:
  git_revision: "9361982"
  dirty_tree: true
  date: "2026-07-26"

studies:
  # ─────────────────────────────────────────────────────────── released / consumed
  - study_id: paper_a_sft_v2
    title: "Fine-tuning specializes a guard"
    question: >
      On a fixed four-checkpoint panel, what does LoRA-SFT change relative to the same
      checkpoint before tuning, split into represented-source and held-out transfer?
    study_state: released
    evidence_state: retrospective_estimation
    publication_state: current
    distribution_state: text_free_only
    test_exposure: check_fast
    evidence_tier: "retrospective estimation on an inspected fixed panel; not preregistered"
    claim_authorization: true
    contract_type: live_release
    verification_mode: live_tree
    verification_command: "make repro-release PY=$(pwd)/.venv/bin/python"
    expected_verification_status: expected_fail
    verification_failure_reason: >
      LOCK.json records a runtime software fingerprint pinning Python 3.12; the local
      .venv is 3.14.4, so score validation reports python_mismatch. This is a
      check-release-tier operation requiring the pinned interpreter, not a local one.
      Local convenience success would not be release verification.
    code_root: experiments/
    config_paths: [configs/paper_a_sft.yaml, configs/paper_a_sft_v2_release_anchor.json]
    artifact_roots: [artifacts/paper_a_sft_v2/, artifacts/paper_a_sft/]
    manuscript_paths: [papers/finetuning-specialization/, papers/unified-report/]
    lock_bound_paths: true
    source_snapshot: "artifacts/paper_a_sft_v2/ execution-source snapshot"
    notes: >
      The live compatibility contract is the release-cache contract. The historical
      training LOCK.json validates fully only against its recorded execution-source
      snapshot; four bound source files differ from their recorded hashes in the
      hardened live checkout, which is expected and is not a regression.

  - study_id: paper_a_sft_v1_historical
    title: "Paper A v1 historical training lock"
    question: "Archival predecessor of the v2 panel."
    study_state: superseded
    evidence_state: development_only
    publication_state: historical
    distribution_state: local_only
    test_exposure: check_locks
    evidence_tier: "historical; superseded by paper_a_sft_v2"
    claim_authorization: false
    contract_type: historical_scientific_lock
    verification_mode: source_snapshot
    # verify-legacy-lock deliberately checks the historical self-hash *without*
    # pretending to be a v2 full-tree verification, so it passes. Full byte/path
    # verification of evolved bound sources belongs in the recorded snapshot.
    verification_command: "make verify-legacy-lock PY=$(pwd)/.venv/bin/python"
    expected_verification_status: expected_pass
    code_root: experiments/
    artifact_roots: [artifacts/paper_a_sft/]
    lock_bound_paths: true
    successor: paper_a_sft_v2

  - study_id: base_adapter_composition
    title: "Output-space composition recovers transfer without retraining"
    question: >
      Does a calibrated equal-weight average of a base guard and its own SFT adapter
      recover the held-out transfer that fine-tuning gave up?
    study_state: released
    evidence_state: retrospective_estimation
    publication_state: current
    distribution_state: text_free_only
    test_exposure: check_fast
    evidence_tier: "retrospective estimation, fixed panel, descriptive intervals"
    claim_authorization: true
    contract_type: live_release
    verification_mode: live_tree
    verification_command: "make -C papers/base-adapter-composition test PYTHON=$(pwd)/.venv/bin/python"
    expected_verification_status: expected_pass
    code_root: experiments/
    artifact_roots: [artifacts/paper_a_sft_v2/]
    manuscript_paths: [papers/base-adapter-composition/, papers/unified-report/]
    lock_bound_paths: true
    consumes: [paper_a_sft_v2]

  - study_id: klsft_v1
    title: "KL-regularized SFT as an anti-forgetting control"
    question: "Does a base-anchored KL penalty preserve the transfer plain SFT gives up?"
    study_state: released
    evidence_state: retrospective_estimation
    publication_state: current
    distribution_state: text_free_only
    test_exposure: none
    evidence_tier: "retrospective, four checkpoints, no interval attached"
    claim_authorization: true
    contract_type: checksum_only_release
    verification_mode: live_tree
    verification_command: "ls artifacts/klsft_v1/"
    expected_verification_status: expected_pass
    code_root: experiments/
    artifact_roots: [artifacts/klsft_v1/]
    manuscript_paths: [papers/unified-report/]
    lock_bound_paths: false
    consumes: [paper_a_sft_v2]

  - study_id: expguard_external
    title: "External validation on ExpGuard"
    question: "Do the base guards rank domain violations well on expert-annotated finance/health/law prompts?"
    study_state: released
    evidence_state: retrospective_estimation
    publication_state: current
    distribution_state: local_only
    test_exposure: none
    evidence_tier: "expert-annotated; the strongest tier in the repository"
    claim_authorization: true
    contract_type: checksum_only_release
    verification_mode: live_tree
    verification_command: "ls artifacts/expguard_external/"
    expected_verification_status: expected_pass
    code_root: experiments/
    artifact_roots: [artifacts/expguard_external/]
    manuscript_paths: [papers/unified-report/]
    lock_bound_paths: false
    notes: "Gated dataset; row text is not redistributable."

  # ──────────────────────────────────────────────────── contract-drifted / blocked
  - study_id: starting_type_adaptation_v1
    title: "Adapting released guards: a confirmatory starting-type study"
    question: "Does the specialization tradeoff also hit models that are already purpose-built guards?"
    study_state: contract_drifted
    evidence_state: preregistered_analysis
    publication_state: current
    distribution_state: text_free_only
    test_exposure: check_fast
    evidence_tier: "analysis-preregistered in a committed claim registry; not blind on data"
    claim_authorization: true
    # Not a protocol candidate: committed checksummed artifacts exist and the unified
    # report states RQ1/RQ2 verdicts from them. The defect is contract drift, not
    # absence of evidence, so the contract class is the release it actually has.
    contract_type: checksum_only_release
    verification_mode: live_tree
    # Artifact presence passes. The drift is a contract fact no `ls` can detect, so it
    # is recorded in notes rather than dressed up as a failing check.
    verification_command: "test -d artifacts/starting_type_adaptation_v1/"
    expected_verification_status: expected_pass
    code_root: experiments/
    config_paths: [configs/starting_type_adaptation_v1.yaml]
    environment_path: requirements-starting-type-adaptation.txt
    artifact_roots: [artifacts/starting_type_adaptation_v1/]
    protocol_paths: [papers/unified-report/proposal.md]
    manuscript_paths: [papers/unified-report/]
    lock_bound_paths: true
    notes: >
      CONTRACT DRIFT: no final LOCK.json exists, the normative contract is dev_nonfinal,
      and the recorded authoring-config hash no longer matches
      configs/starting_type_adaptation_v1.yaml. claim_authorization is true because
      RQ1/RQ2 verdicts are reported in the unified report from committed artifacts, but
      the drift must be resolved before any new claim.

  - study_id: mortgage_benchmark_v1_hmda2022
