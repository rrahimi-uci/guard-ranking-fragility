    question: "Can a general-safety score see a mortgage-policy violation that reads as polite text?"
    study_state: released
    evidence_state: retrospective_estimation
    publication_state: current
    distribution_state: unresolved
    test_exposure: check_fast
    evidence_tier: "LLM-judge and policy-card-consistent; not SME-adjudicated"
    claim_authorization: true
    contract_type: checksum_only_release
    verification_mode: live_tree
    verification_command: "make -C mortgage-benchmark test PY=$(pwd)/.venv/bin/python"
    expected_verification_status: expected_pass
    code_root: mortgage-benchmark/
    artifact_roots: [mortgage-benchmark/out_eval/]
    manuscript_paths: [papers/mortgage-guardrail-benchmark/, papers/unified-report/]
    lock_bound_paths: false
    notes: >
      Checksums cover release bytes only, not the generator, judge, configuration, or
      code. distribution_state is unresolved: see benchmarks/registry/distribution.yaml.

  # ───────────────────────────────────────────────────────────── Paper C surfaces
  - study_id: paper_c_matched_dpo_scaffold
    title: "Paper C root-level matched-DPO candidate (unrun scaffold)"
    question: "Does DPO's frozen reference help a binary guard beyond an uncentered pairwise loss?"
    study_state: superseded
    evidence_state: none
    publication_state: superseded
    distribution_state: local_only
    test_exposure: check_fast
    evidence_tier: "none; never executed"
    claim_authorization: false
    contract_type: protocol_candidate
    verification_mode: candidate_inventory
    verification_command: "PYTHONPATH=$(pwd) $(pwd)/.venv/bin/python -m pytest tests/test_paper_c_dpo.py -q"
    expected_verification_status: expected_pass
    code_root: experiments/
    config_paths: [configs/paper_c_dpo_v2.json]
    protocol_paths: [docs/paper-c-prereg-v2.md, docs/paper-c-code-design.md]
    lock_bound_paths: false
    successor: paper_c_specialize_align_mortgage_v1
    notes: >
      A flat scaffold spanning docs/, configs/, experiments/ and tests/. Never run. Its
      disposition relative to the active successor is recorded here; some older indexes
      still described it as current.

  - study_id: paper_c_reference_centering
    title: "Paper C predecessor: reference centering (stopped)"
    question: "What does DPO's frozen reference buy a one-token binary safety guard?"
    study_state: stopped
    evidence_state: none
    publication_state: historical
    distribution_state: local_only
    test_exposure: check_fast
    evidence_tier: "none; final smoke failed a policy/reference identity check before Stage 2"
    claim_authorization: false
    contract_type: historical_scientific_lock
    verification_mode: source_snapshot
    # The CPU contract suite passes (35 tests). What legitimately fails is *lock*
    # validation against the evolved tree -- a different operation, recorded in notes
    # rather than conflated with the test command, so a real suite regression is visible.
    verification_command: "make -C papers/paper_c test PYTHON=$(pwd)/.venv/bin/python"
    expected_verification_status: expected_pass
    code_root: papers/paper_c/
    status_path: papers/paper_c/STATUS.md
    manuscript_paths: [papers/paper_c/manuscript/]
    lock_bound_paths: true
    successor: paper_c_specialize_align_mortgage_v1
    notes: >
      All seven cloud attempts exited unsuccessfully. Supplies no reusable result,
      pilot estimate, readiness gate, or lock parent. The frontier-estimand and
      power-gate design work is retained for the record but does not transfer.

  - study_id: paper_c_specialize_align_mortgage_v1
    title: "Specialize, Then Align? (stopped after the disjoint pilot)"
    question: >
      With the student objective fixed, do adjudicated specialist candidates teach a
      more uniformly capable guard than adjudicated generalist candidates?
    study_state: stopped
    evidence_state: development_only
    publication_state: draft
    distribution_state: local_only
    test_exposure: check_fast
    evidence_tier: "development-only; auto-adjudicated against gold, no human reviewer, no sealed cohort"
    claim_authorization: false
    contract_type: protocol_candidate
    verification_mode: candidate_inventory
    verification_command: "make -C papers/paper_c/specialize_then_align test PY=$(pwd)/.venv/bin/python"
    expected_verification_status: expected_fail
    verification_failure_reason: >
      The tracked candidate lock binds live source bytes and the source tree has since
      evolved, so test_candidate_lock fails by design. The candidate authorizes no data
      build, training, or claim, and no child authorization lock exists.
    code_root: papers/paper_c/specialize_then_align/
    config_paths:
      - papers/paper_c/specialize_then_align/config/study.json
      - papers/paper_c/specialize_then_align/config/smoke.json
    protocol_paths:
      - papers/paper_c/specialize_then_align/PROTOCOL.md
      - papers/paper_c/specialize_then_align/DEVELOPMENT_PLAN.md
    status_path: papers/paper_c/specialize_then_align/STATUS.md
    manuscript_paths: [papers/paper_c/specialize_then_align/manuscript/]
    lock_bound_paths: true
    predecessor: paper_c_reference_centering
    supersedes: [paper_c_reference_centering, paper_c_matched_dpo_scaffold]
    external_object_manifest: papers/paper_c/specialize_then_align/provenance/EXTERNAL_OBJECT_MANIFEST.json
    restore_command: "gsutil -m cp -r gs://jazzx-gcp-poc-1-paper-c/v2/sta/ <dest>"
    notes: >
      Stopped after the 44-cell pilot. Its result is an identifiability finding: with a
      three-action head, gold-based adjudication, and structured fields derived from
      gold, the two candidate-source inventories were 98.9%/97.7% byte-identical and
      the primary contrast was unidentified. The 66-cell primary panel was never
      authorized; all five readiness gates remain false.

  - study_id: paper_c_sta_study_package_v1
    title: "Specialize, Then Align? — Phase 4 study package (migrated copy)"
    question: >
      Same question as paper_c_specialize_align_mortgage_v1; this is the migrated
      study-package instantiation, not a second study.
    study_state: stopped
    evidence_state: development_only
    publication_state: draft
    distribution_state: local_only
    test_exposure: check_fast
    evidence_tier: "development-only; a copy authorizes nothing the original did not"
    claim_authorization: false
    contract_type: protocol_candidate
    verification_mode: candidate_inventory
    verification_command: "make -C studies/paper-c-specialize-align-mortgage-v1 test PY=$(pwd)/.venv/bin/python"
    expected_verification_status: expected_fail
    verification_failure_reason: >
      Same declared failure as the predecessor tree: the candidate lock binds live source
      bytes and the source has evolved. 66 passed / 1 failed, identical to the original,
      which is the evidence that the copy is behaviourally equivalent.
    code_root: studies/paper-c-specialize-align-mortgage-v1/
    config_paths:
      - studies/paper-c-specialize-align-mortgage-v1/config/study.json
      - studies/paper-c-specialize-align-mortgage-v1/config/smoke.json
    protocol_paths:
      - studies/paper-c-specialize-align-mortgage-v1/PROTOCOL.md
    environment_path: studies/paper-c-specialize-align-mortgage-v1/environment/README.md
    status_path: studies/paper-c-specialize-align-mortgage-v1/STATUS.md
    manuscript_paths: [studies/paper-c-specialize-align-mortgage-v1/manuscript/]
    lock_bound_paths: true
    predecessor: paper_c_specialize_align_mortgage_v1
    external_object_manifest: studies/paper-c-specialize-align-mortgage-v1/provenance/EXTERNAL_OBJECT_MANIFEST.json
    restore_command: "gsutil -m cp -r gs://jazzx-gcp-poc-1-paper-c/v2/sta/<prefix> <dest>/"
    notes: >
      A COPY, not a move: papers/paper_c/specialize_then_align/ remains intact as a
      compatibility surface, per the plan's prohibition on moving an active tree before
      the new version verifies independently. Both verify at 66 passed / 1 failed and
      both resolve the repository root correctly, which required replacing fixed-parent
      discovery -- parents[2] is right at depth 3 but pointed outside the repository at
      the study package's depth 2. provenance/MIGRATION_MANIFEST.json records old and new
      tree hashes; the only divergent file between the trees is that manifest.

  # ─────────────────────────────────────────────────────────────── publications
  - study_id: unified_report
    title: "The Safety-Guard Benchmark Chooses the Winner"
    question: "Synthesis: how the benchmark co-produces a guard's apparent quality."
    study_state: released
    evidence_state: retrospective_estimation
    publication_state: current
    distribution_state: text_free_only
    test_exposure: check_papers
    evidence_tier: "mixed; each act declares its own tier"
    claim_authorization: true
    contract_type: live_release
    verification_mode: live_tree
    verification_command: "test -f papers/unified-report/unified_report.pdf"
    expected_verification_status: expected_pass
    code_root: papers/unified-report/
    manuscript_paths: [papers/unified-report/unified_report.pdf, papers/unified-report/slides/]
    lock_bound_paths: true
    consumes: [paper_a_sft_v2, base_adapter_composition, klsft_v1, expguard_external,
               starting_type_adaptation_v1, mortgage_benchmark_v1_hmda2022]
    notes: >
      reproduce-check mutates canonical figure/intermediate files; it is excluded from
      read-only verification tiers until refactored to temporary output roots.
